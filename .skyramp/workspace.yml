# Skyramp Workspace Configuration
workspace:
  repoName: mrugeshmaster/plane
  repoUrl: git@github.com:mrugeshmaster/plane.git
metadata:
  schemaVersion: v1
  mcpVersion: 0.0.59
  executorVersion: v1.3.12
  createdAt: "2026-03-16T17:22:01.675Z"
  updatedAt: "2026-03-16T17:22:01.679Z"
services:
  - serviceName: plane-api
    language: python
    framework: pytest
    outputDir: apps/api/plane/tests/skyramp
