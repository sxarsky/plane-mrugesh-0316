      schemaPath: http://localhost:8000/api/schema/
      authType: apiKey
      authHeader: X-API-Key
      baseUrl: http://localhost:8000
    runtimeDetails:
      serverStartCommand: docker compose up -d plane-db plane-redis migrator api worker
      runtime: docker
      dockerNetwork: plane_default
